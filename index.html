<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EstateAI Rajkot CRM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --primary:#2563eb;--primary2:#1d4ed8;--bg:#f4f7fb;--card:#fff;
 --text:#172033;--muted:#667085;--border:#e5e7eb;--sidebar:#101828;
 --green:#16a34a;--orange:#f59e0b;--red:#ef4444;--purple:#7c3aed;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.sidebar{
 width:250px;background:var(--sidebar);color:#fff;position:fixed;
 inset:0 auto 0 0;z-index:50;display:flex;flex-direction:column
}
.logo{padding:22px 20px;border-bottom:1px solid #273244}
.logo h1{font-size:24px}.logo h1 span{color:#60a5fa}
.logo p{color:#98a2b3;font-size:12px;margin-top:5px}
.nav{padding:13px 10px;overflow:auto;flex:1}
.nav button{
 width:100%;border:0;background:transparent;color:#aeb8c8;padding:10px 12px;
 margin-bottom:4px;border-radius:9px;text-align:left;display:flex;
 align-items:center;gap:10px
}
.nav button:hover{background:#1d2939;color:#fff}
.nav button.active{background:var(--primary);color:#fff}
.nav-icon{width:22px;text-align:center}
.sidebar-bottom{padding:14px;border-top:1px solid #273244}
.profile{display:flex;align-items:center;gap:10px}
.avatar{
 width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);
 display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold
}
.main{margin-left:250px;width:calc(100% - 250px)}
.topbar{
 height:70px;background:#fff;border-bottom:1px solid var(--border);padding:0 24px;
 display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30
}
.search{width:420px;position:relative}
.search span{position:absolute;left:13px;top:10px;color:#98a2b3}
.search input{width:100%;padding:11px 15px 11px 39px;border:1px solid var(--border);border-radius:9px;outline:none}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:39px;height:39px;border:1px solid var(--border);background:#fff;border-radius:9px}
.content{padding:25px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.page-head h2{font-size:28px}.page-head p{color:var(--muted);margin-top:5px}
.primary{background:var(--primary);color:#fff;border:0;padding:11px 16px;border-radius:8px;font-weight:bold}
.primary:hover{background:var(--primary2)}
.secondary{background:#fff;border:1px solid var(--border);padding:10px 14px;border-radius:8px}
.danger{background:#fff;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:8px}
.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:13px;padding:18px}
.kpi h3{font-size:27px;margin:10px 0 5px}.kpi p{color:var(--muted);font-size:13px}
.kpi-icon{float:right;font-size:23px;background:#eff6ff;padding:8px;border-radius:9px}
.up{color:var(--green);font-size:12px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter{padding:10px 12px;border:1px solid var(--border);background:#fff;border-radius:8px}
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:13px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:13px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:#f8fafc;color:#667085;font-size:11px;text-transform:uppercase}
td{font-size:14px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}
.green{background:#dcfce7;color:#15803d}.blue{background:#dbeafe;color:#1d4ed8}
.orange{background:#fef3c7;color:#b45309}.red{background:#fee2e2;color:#b91c1c}
.purple{background:#ede9fe;color:#6d28d9}.gray{background:#eef2f7;color:#475467}
.property-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.property{background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden}
.property-img{
 height:145px;background:linear-gradient(135deg,#dbeafe,#93c5fd);
 display:flex;align-items:center;justify-content:center;font-size:55px
}
.property-body{padding:15px}.property-body h3{margin:9px 0 5px}
.property-body p{color:var(--muted);font-size:13px;margin:5px 0}
.property-footer{margin-top:13px;display:flex;justify-content:space-between;align-items:center}
.kanban{display:flex;gap:14px;overflow:auto;padding-bottom:10px}
.column{min-width:245px;width:245px;background:#eef2f7;border-radius:12px;padding:12px}
.column-head{display:flex;justify-content:space-between;margin-bottom:10px}
.lead-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px}
.lead-card h4{margin-bottom:6px}.lead-card p{font-size:12px;color:var(--muted);margin:4px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.form-group{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}
.form-group label{font-size:13px;font-weight:bold}
.form-group input,.form-group select,.form-group textarea{
 padding:11px;border:1px solid var(--border);border-radius:8px;outline:none;background:#fff
}
.form-group textarea{min-height:95px;resize:vertical}
.form-actions{margin-top:20px;display:flex;justify-content:flex-end;gap:9px}
.modal-bg{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-bg.show{display:flex}
.modal{width:760px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:14px}
.modal-head{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:20px}
.activity-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.dot{width:10px;height:10px;background:var(--primary);border-radius:50%;margin-top:5px;flex:none}
.chart{height:230px;display:flex;align-items:flex-end;gap:15px;padding:10px;border-bottom:1px solid var(--border);margin-top:18px}
.bar{flex:1;background:linear-gradient(#60a5fa,#2563eb);border-radius:6px 6px 0 0;position:relative}
.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.feature-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.feature{border:1px solid var(--border);border-radius:10px;padding:15px;background:#fff}
.feature p{font-size:12px;color:var(--muted);margin-top:5px}
.login-screen{
 min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a);
 display:flex;align-items:center;justify-content:center;padding:20px
}
.login-box{width:420px;max-width:100%;background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 70px #0005}
.login-logo{text-align:center;margin-bottom:25px}.login-logo h1{font-size:31px}
.login-logo span{color:#2563eb}.login-logo p{color:#667085;font-size:13px;margin-top:5px}
.login-box input{width:100%;padding:13px;border:1px solid var(--border);border-radius:9px;margin:7px 0 14px}
.login-box label{font-size:13px;font-weight:bold}
.login-box button{width:100%;padding:13px;margin-top:5px}
.login-error{color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px}
.stat-mini{padding:16px;background:#f8fafc;border-radius:10px}
.match{border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px;background:#fff}
.progress{height:8px;background:#eef2f7;border-radius:10px;overflow:hidden;margin-top:7px}
.progress div{height:100%;background:#2563eb}
.toast{
 position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:13px 17px;
 border-radius:9px;z-index:300;box-shadow:0 10px 30px #0003
}
.dark{--bg:#0f172a;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--border:#263244}
.dark .card,.dark .kpi,.dark .property,.dark .lead-card,.dark .table-wrap,.dark .modal,
.dark .secondary,.dark .filter,.dark .form-group input,.dark .form-group select,.dark .form-group textarea,
.dark .feature{background:#111827;color:#f8fafc;border-color:#263244}
.dark .topbar{background:#111827;border-color:#263244}
.dark th{background:#172033}.dark .stat-mini{background:#172033}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.property-grid{grid-template-columns:repeat(2,1fr)}.feature-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
 .sidebar{width:70px}.logo h1,.logo p,.nav button span:not(.nav-icon),.profile-text{display:none}
 .nav button{justify-content:center}.main{margin-left:70px;width:calc(100% - 70px)}
 .search{width:240px}.grid2,.grid3{grid-template-columns:1fr}.property-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
 .content{padding:14px}.topbar{padding:0 10px}.search{width:170px}.kpis{grid-template-columns:1fr}
 .form-grid{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}
 .page-head{align-items:flex-start;flex-direction:column}
}

/* =========================================================
   ESTATEAI PRO UX / AUTHENTIC WELCOME / PHOTO / REALTIME
========================================================= */
:root{
 --pro-grad:linear-gradient(135deg,#2563eb 0%,#7c3aed 55%,#06b6d4 100%);
 --glass:rgba(255,255,255,.72);
}
*{scrollbar-width:thin}
button,.nav button,.icon-btn,.primary,.secondary,.danger,.feature,.kpi,.property,.card{
 transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
button:hover{transform:translateY(-1px)}
.kpi:hover,.property:hover,.feature:hover,.card.pro-hover:hover{
 box-shadow:0 14px 35px rgba(16,24,40,.10);transform:translateY(-2px)
}
.pro-welcome{
 position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 20% 20%,#38bdf8 0,transparent 28%),
            radial-gradient(circle at 80% 80%,#8b5cf6 0,transparent 30%),
            linear-gradient(135deg,#07111f,#172554 55%,#0f172a);
 overflow:hidden;animation:proFade .45s ease;
}
.pro-welcome.hidden{display:none}
.pro-orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.45;animation:proFloat 8s ease-in-out infinite}
.pro-orb.o1{width:240px;height:240px;background:#38bdf8;top:-60px;left:-40px}
.pro-orb.o2{width:300px;height:300px;background:#8b5cf6;right:-90px;bottom:-100px;animation-delay:-3s}
.pro-welcome-box{
 width:min(720px,92vw);padding:45px 38px;border:1px solid rgba(255,255,255,.18);
 border-radius:28px;background:rgba(255,255,255,.10);backdrop-filter:blur(20px);
 color:#fff;text-align:center;box-shadow:0 35px 100px rgba(0,0,0,.35);
 position:relative;overflow:hidden;
}
.pro-welcome-box:after{
 content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.16),transparent 65%);
 transform:translateX(-100%);animation:proShine 1.7s ease .3s forwards;
}
.pro-welcome-icon{font-size:58px;margin-bottom:12px;animation:proPop .7s cubic-bezier(.2,.8,.2,1)}
.pro-welcome-box h1{font-size:clamp(30px,6vw,54px);letter-spacing:-1.5px}
.pro-welcome-box h1 span{color:#7dd3fc}
.pro-welcome-box p{margin-top:10px;color:#dbeafe;font-size:15px}
.pro-welcome-status{margin-top:24px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pro-pill{padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
.pro-loading{height:4px;background:rgba(255,255,255,.16);border-radius:9px;margin-top:26px;overflow:hidden}
.pro-loading div{height:100%;width:0;background:#fff;animation:proLoad 1.6s ease forwards}
.pro-hero{
 background:var(--pro-grad);color:#fff;border-radius:20px;padding:26px;margin-bottom:20px;
 position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(37,99,235,.20)
}
.pro-hero:before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;
background:rgba(255,255,255,.12);right:-70px;top:-100px}
.pro-hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:center}
.pro-hero h2{font-size:clamp(25px,4vw,39px);margin-bottom:8px}
.pro-hero p{color:#e0f2fe;line-height:1.55}
.pro-quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pro-quick div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);
padding:13px;border-radius:13px}
.pro-quick strong{display:block;font-size:22px}
.photo-drop{
 border:2px dashed #cbd5e1;border-radius:14px;padding:18px;text-align:center;
 background:#f8fafc;cursor:pointer
}
.photo-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.photo-preview img{width:100%;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.pro-source{
 display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;
 border:1px solid var(--border);border-radius:12px;margin:8px 0;background:#fff
}
.pro-source small{color:var(--muted)}
.pro-live-dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#22c55e;
box-shadow:0 0 0 5px #dcfce7;animation:proPulse 1.5s infinite;margin-right:8px}
.pro-command{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px
}
.pro-command button{padding:13px;border:1px solid var(--border);background:#fff;border-radius:11px;text-align:left}
.dark .photo-drop,.dark .pro-source,.dark .pro-command button{background:#111827;border-color:#263244;color:#fff}
.dark .pro-source small{color:#94a3b8}
@keyframes proFade{from{opacity:0}to{opacity:1}}
@keyframes proPop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes proFloat{50%{transform:translateY(-24px) scale(1.04)}}
@keyframes proShine{to{transform:translateX(100%)}}
@keyframes proLoad{to{width:100%}}
@keyframes proPulse{50%{box-shadow:0 0 0 8px rgba(34,197,94,.08)}}
@media(max-width:800px){.pro-hero-grid{grid-template-columns:1fr}.pro-command{grid-template-columns:1fr}.photo-preview{grid-template-columns:repeat(2,1fr)}}

</style>

<style id="estateai-premium-motion">
:root{--ease-premium:cubic-bezier(.16,1,.3,1)}
@keyframes eaReveal{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes eaGlow{0%,100%{box-shadow:0 0 0 rgba(59,130,246,0)}50%{box-shadow:0 0 34px rgba(59,130,246,.18)}}
@keyframes eaFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-8px,0)}}
@keyframes eaShimmer{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
@keyframes eaPulse{0%,100%{opacity:.65;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
.login-screen{overflow:hidden;position:relative;background:radial-gradient(circle at 15% 15%,rgba(56,189,248,.24),transparent 28%),radial-gradient(circle at 85% 80%,rgba(139,92,246,.25),transparent 30%),linear-gradient(135deg,#030712,#0f172a 48%,#111827)}
.login-screen:before,.login-screen:after{content:"";position:absolute;border-radius:50%;filter:blur(8px);pointer-events:none;animation:eaFloat 7s ease-in-out infinite}.login-screen:before{width:320px;height:320px;left:-110px;top:-80px;background:rgba(34,211,238,.18)}.login-screen:after{width:420px;height:420px;right:-150px;bottom:-180px;background:rgba(124,58,237,.18);animation-delay:-3s}
.login-box{position:relative;z-index:2;animation:eaReveal .8s var(--ease-premium) both;box-shadow:0 35px 100px rgba(0,0,0,.42),0 0 50px rgba(59,130,246,.08);backdrop-filter:blur(22px)}
.login-box:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 35%,rgba(56,189,248,.28),transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.login-logo h1{letter-spacing:-2px;text-shadow:0 0 28px rgba(125,211,252,.22)}
.login-box input{transition:.3s var(--ease-premium)}.login-box input:focus{transform:translateY(-2px);box-shadow:0 0 0 3px rgba(59,130,246,.12),0 12px 30px rgba(15,23,42,.08)}
.login-box button{position:relative;overflow:hidden;transition:.35s var(--ease-premium)}.login-box button:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.35),transparent 70%);transform:translateX(-120%)}.login-box button:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(37,99,235,.25)}.login-box button:hover:before{animation:eaShimmer .75s ease}
.content{animation:eaReveal .55s var(--ease-premium) both}
.content>.card,.content>.kpis,.content>.grid2,.content>.grid3,.content>.page-head{animation:eaReveal .55s var(--ease-premium) both}
.kpis>.kpi,.kpi{transition:transform .35s var(--ease-premium),box-shadow .35s ease}.kpi:hover{transform:translateY(-7px) scale(1.015);animation:eaGlow 2.2s ease infinite}
.property,.feature,.card{transition:transform .35s var(--ease-premium),box-shadow .35s ease,border-color .35s ease}.property:hover,.feature:hover{transform:translateY(-7px) scale(1.01);box-shadow:0 22px 55px rgba(15,23,42,.12)}
.property img{transition:transform .7s var(--ease-premium),filter .5s ease}.property:hover img{transform:scale(1.045);filter:saturate(1.08)}
.nav button{transition:transform .25s var(--ease-premium),background .25s ease,color .25s ease}.nav button:hover{transform:translateX(5px)}
.nav button.active{box-shadow:inset 3px 0 0 currentColor}
.topbar{backdrop-filter:blur(14px)}
.modal-bg.show .modal{animation:eaReveal .4s var(--ease-premium) both}
.modal-bg{backdrop-filter:blur(7px)}
.toast{animation:eaReveal .45s var(--ease-premium) both}
.pro-hero{animation:eaReveal .65s var(--ease-premium) both;overflow:hidden}.pro-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.11),transparent 65%);transform:translateX(-120%);animation:eaShimmer 2.8s ease-in-out infinite}.pro-quick>div{animation:eaFloat 4s ease-in-out infinite}.pro-quick>div:nth-child(2){animation-delay:-.7s}.pro-quick>div:nth-child(3){animation-delay:-1.4s}.pro-quick>div:nth-child(4){animation-delay:-2.1s}
.badge.green{animation:eaPulse 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <h1>Estate<span>AI</span></h1>
      <p>Rajkot Real Estate CRM</p>
    </div>

    <div id="loginError" class="login-error hidden"></div>

    <label>Username</label>
    <input id="loginUser" placeholder="User ID or email">

    <label>Password</label>
    <input id="loginPass" type="password" placeholder="••••••••"
      onkeydown="if(event.key==='Enter')login()">

    <button class="primary" onclick="login()">Login</button>

    <p style="font-size:12px;color:#667085;margin-top:15px;text-align:center">
      Secure cloud authentication

<!-- APP -->
<div id="app" class="app hidden">

    <h1>Estate<span>AI</span></h1>
    <p>Rajkot Real Estate CRM</p>
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="sidebar-bottom">
    <div class="profile">
      <div class="avatar" id="sideAvatar">A</div>
      <div class="profile-text">
        <strong id="sideName">Admin</strong><br>
        <small style="color:#98a2b3" id="sideRole">Administrator</small>

    <div class="search">
      <span>🔍</span>

        oninput="globalSearch(this.value)">
    </div>
    <div class="top-actions">
      <button class="icon-btn" onclick="showNotifications()">🔔</button>
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>
      <button class="icon-btn" onclick="logout()">↪</button>

      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

let cloudSaveTimer=null;
async function cloudLoadState(userId){
  const {data,error}=await estateaiSupabase.from("estateai_state").select("state").eq("user_id",userId).maybeSingle();
  if(error) throw error;
  if(data?.state){ db={...clone(defaultData),...data.state}; proEnsureArray(); }
  else { db=clone(defaultData); proEnsureArray(); await cloudSaveState(userId); }
  return db;
}
async function cloudSaveState(userId){
  if(!userId) return;
  const state=clone(db);
  const {error}=await estateaiSupabase.from("estateai_state").upsert({user_id:userId,state,updated_at:new Date().toISOString()},{onConflict:"user_id"});
  if(error){ console.error("Cloud save failed",error); toast("Cloud save failed: "+error.message); }
}
function saveDB(){
  if(currentUser?.auth_id){
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer=setTimeout(()=>cloudSaveState(currentUser.auth_id),150);
  }
}
function uid(){

function toast(msg){
  const old=document.querySelector(".toast");
  if(old)old.remove();
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=msg;
  document.body.appendChild(t);

}

function authEmailFromInput(v){
  const x=String(v||"").trim();
  return x==="1" ? ESTATEAI_ADMIN_EMAIL : x;
}
async function login(){
  const input=document.getElementById("loginUser").value.trim();
  const password=document.getElementById("loginPass").value;
  const errorEl=document.getElementById("loginError");
  errorEl.classList.add("hidden");
  if(!input||!password){ errorEl.textContent="Enter your login details."; errorEl.classList.remove("hidden"); return; }
  const email=authEmailFromInput(input);
  const {data,error}=await estateaiSupabase.auth.signInWithPassword({email,password});
  if(error||!data?.user){ errorEl.textContent="Invalid ID or password."; errorEl.classList.remove("hidden"); return; }
  await enterAuthenticatedApp(data.user);
}
async function enterAuthenticatedApp(authUser){
  await cloudLoadState(authUser.id);
  let profile=null;
  const q=await estateaiSupabase.from("user_profiles").select("id,name,email,role,active").eq("id",authUser.id).maybeSingle();
  if(q.error) console.warn(q.error); else profile=q.data;
  const isAdminUser=authUser.email?.toLowerCase()===ESTATEAI_ADMIN_EMAIL;
  if(profile?.active===false){ await estateaiSupabase.auth.signOut(); throw new Error("Account disabled"); }
  currentUser={
    auth_id:authUser.id,id:authUser.id,name:profile?.name||authUser.user_metadata?.name||authUser.email.split("@")[0],
    username:isAdminUser?"1":authUser.email.split("@")[0],email:authUser.email,
    role:isAdminUser?"Admin":(profile?.role||"Agent"),active:true
  };
  await estateaiSupabase.from("user_profiles").upsert({id:authUser.id,name:currentUser.name,email:authUser.email,role:currentUser.role,active:true,updated_at:new Date().toISOString()},{onConflict:"id"});
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  buildNav(); updateProfile(); showPage("dashboard"); setTimeout(proWelcome,120);
}
async function restoreSession(){
  try{
    const {data}=await estateaiSupabase.auth.getSession();

function saveProperty(e,id){
 e.preventDefault();
 const obj={
  id:id||uid(),
  title:document.getElementById("pTitle").value,
  type:document.getElementById("pType").value,
  purpose:document.getElementById("pPurpose").value,
  price:document.getElementById("pPrice").value,
  area:document.getElementById("pArea").value,
  bhk:document.getElementById("pBhk").value,
  city:"Rajkot",
  locality:document.getElementById("pLocality").value,
  owner:document.getElementById("pOwner").value,
  status:document.getElementById("pStatus").value,
  verified:document.getElementById("pVerified").value==="yes",
  updated:"Just now",
  notes:document.getElementById("pNotes").value
 };
 if(id){
  const i=db.properties.findIndex(p=>p.id===id);
  if(i>=0)db.properties[i]=obj;
  addActivity("Property updated: "+obj.title);
 }else{
  db.properties.unshift(obj);
  addActivity("Property added: "+obj.title);
 }
 saveDB();closeModal();showPage("properties");toast("Property saved");
}

 const p=db.properties.find(x=>x.id===id);

function deleteProperty(id){
 if(!isAdmin())return toast("Admin access required");
 const p=db.properties.find(x=>x.id===id);
 if(!p)return;
 if(confirm("Delete this property?")){
  db.properties=db.properties.filter(x=>x.id!==id);
  addActivity("Property deleted: "+p.title);
  saveDB();showPage("properties");toast("Property deleted");
 }
}

   </select>
  </div>
  <div id="matches" style="margin-top:20px">${selected?matchesFor(selected):"<p>No buyer leads available.</p>"}</div>
 </div>`;

function parseMoney(s){
 if(!s)return null;
 const m=String(s).replace(/,/g,"").match(/([\d.]+)\s*(Cr|crore|L|lakh|K|k)?/i);
 if(!m)return null;
 let n=Number(m[1]),unit=(m[2]||"").toLowerCase();
 if(unit==="cr"||unit==="crore")n*=10000000;
 else if(unit==="l"||unit==="lakh")n*=100000;
 else if(unit==="k")n*=1000;
 return n;
}
function buyerBudgetNumber(budget){
 const nums=String(budget||"").match(/[\d.]+\s*(?:Cr|L|K)?/gi);
 if(!nums)return null;
 const values=nums.map(parseMoney).filter(Boolean);
 return values.length?Math.max(...values):null;
}
function matchesFor(id){
 const b=db.leads.find(x=>x.id===Number(id));
 if(!b)return "";
 const budget=buyerBudgetNumber(b.budget);
 const req=(b.requirement||"").toLowerCase();
 const loc=(b.location||"").toLowerCase();

 const results=db.properties.map(p=>{
  let score=0;
  if(loc && (p.locality||"").toLowerCase().includes(loc))score+=35;
  else if(loc && "rajkot".includes(loc))score+=15;
  const price=parseMoney(p.price);
  if(budget&&price){
   if(price<=budget)score+=40;
   else if(price<=budget*1.15)score+=25;
  }else score+=15;
  if(req){
   if(req.includes(String(p.bhk||"").toLowerCase()))score+=15;
   if(req.includes((p.type||"").toLowerCase()))score+=10;
  }else score+=10;
  if(p.purpose==="Rent" && b.type==="Tenant")score+=10;
  if(p.purpose==="Sale" && b.type!=="Tenant")score+=10;
  return {...p,match:Math.min(100,score)};
 }).sort((a,c)=>c.match-a.match).slice(0,8);

 return results.map(p=>`
  <div class="match">
   <div style="display:flex;justify-content:space-between;gap:10px">
    <div><strong>${esc(p.title)}</strong><p style="font-size:12px;color:#667085">${esc(p.locality)} · ${esc(p.price)}</p></div>
    <span class="badge ${p.match>=75?"green":p.match>=50?"blue":"orange"}">${p.match}% Match</span>
   </div>
   <div class="progress"><div style="width:${p.match}%"></div></div>
   <div style="margin-top:10px"><button class="secondary" onclick="viewProperty(${p.id})">View Property</button></div>
  </div>`).join("");
}
function renderMatches(){
 const id=document.getElementById("matchBuyer").value;
 document.getElementById("matches").innerHTML=matchesFor(id);
}

   if(!data.properties||!data.leads)throw new Error();

 };

}

function convertSocialLead(id){
 const x=db.socialInbox.find(a=>a.id===id);if(!x)return;
 const lead={id:uid(),name:x.name,phone:x.phone,type:x.intent==="Sell"?"Seller":"Buyer",
 location:x.location,budget:"",requirement:x.message,status:"New",source:x.source,score:60};
 db.leads.unshift(lead);addActivity("Social lead converted: "+x.name);proPersist();showPage("leads");toast("CRM lead created");
}

/* AI: genuine API calls require a secure backend; never expose a production secret in frontend. */
function aiPage(){
 return `
 <div class="page-head"><div><h2>🤖 EstateAI Intelligence</h2><p>CRM analysis + secure AI connection point.</p></div></div>
 <div class="grid2">
  <div class="card">
   <h3>CRM AI</h3><p style="color:#667085;margin:7px 0 15px">Ask about your local CRM data.</p>
   <div id="chat" style="max-height:390px;overflow:auto"></div>
   <div style="display:flex;gap:8px;margin-top:10px"><input id="aiInput" class="filter" style="flex:1" placeholder="e.g. How many seller leads?">
   <button class="primary" onclick="askAI()">Ask</button></div>
  </div>
  <div class="card">
   <h3>Real AI Connection</h3>
   <p style="color:#667085;margin-top:7px">For production AI, use a backend proxy so your API key is never exposed to visitors.</p>
   <div class="stat-mini" style="margin-top:15px"><b>Connection</b><p>${db.settings.integrations.ai?"Marked ready":"Not configured"}</p></div>
   ${isAdmin()?'<button class="secondary" style="margin-top:12px" onclick="openConnectorModal()">Configure AI</button>':""}
  </div>
 </div>`;
}
function askAI(){
 const input=document.getElementById("aiInput"),q=(input?.value||"").trim();if(!q)return;
 const low=q.toLowerCase();let answer="";
 if(low.includes("property"))answer=`There are ${db.properties.length} properties in the CRM. ${db.properties.filter(p=>p.status==="Active").length} are active.`;
 else if(low.includes("buyer"))answer=`There are ${db.leads.filter(l=>l.type==="Buyer").length} buyer leads.`;
 else if(low.includes("seller"))answer=`There are ${db.leads.filter(l=>l.type==="Seller").length} seller leads.`;
 else if(low.includes("lead"))answer=`There are ${db.leads.length} total CRM leads.`;
 else if(low.includes("follow"))answer=`${db.followups.filter(f=>f.status!=="Completed").length} follow-ups are pending.`;
 else if(low.includes("social"))answer=`${db.socialInbox.length} incoming social/web records are in the queue.`;
 else answer="I can analyze properties, buyers, sellers, leads, social inbox and follow-ups. Connect a secure backend AI endpoint for generative answers.";
 const chat=document.getElementById("chat");
 chat.innerHTML+=`<div style="background:#eff6ff;padding:12px;border-radius:10px;margin:9px 0"><b>EstateAI</b><p style="margin-top:5px">${esc(answer)}</p></div>`;
 input.value="";chat.scrollTop=chat.scrollHeight;
}

async function adminCloudUsers(){
  if(!isAdmin()) return [];
  const {data,error}=await estateaiSupabase.from("user_profiles").select("id,name,email,role,active,updated_at").order("updated_at",{ascending:false});
  if(error){toast(error.message);return [];} return data||[];
}
async function viewUserCloudData(userId){
  if(!isAdmin()) return;
  const {data,error}=await estateaiSupabase.from("estateai_state").select("state,updated_at").eq("user_id",userId).maybeSingle();
  if(error){toast(error.message);return;}
  const st=data?.state||{};
  document.getElementById("modalTitle").textContent="User Cloud Data";
  document.getElementById("modalBody").innerHTML=`<div class="kpis">${kpi("🏠","Properties",(st.properties||[]).length,"Cloud")}${kpi("👥","Leads",(st.leads||[]).length,"Cloud")}${kpi("📅","Follow-ups",(st.followups||[]).length,"Cloud")}${kpi("🤝","Deals",(st.deals||[]).length,"Cloud")}</div><div class="card"><pre style="white-space:pre-wrap;max-height:450px;overflow:auto">${esc(JSON.stringify(st,null,2))}</pre></div>`; openModal();
}
async function renderAdminUsers(){
  const users=await adminCloudUsers();
  const box=document.getElementById("adminCloudUsers"); if(!box)return;
  box.innerHTML=users.map(u=>`<div class="card" style="margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center"><div><strong>${esc(u.name||"User")}</strong><div style="color:#667085;font-size:13px">${esc(u.email)} · ${esc(u.role||"Agent")} · ${u.active===false?"Disabled":"Active"}</div></div><button class="secondary" onclick="viewUserCloudData('${u.id}')">View Cloud Data</button></div>`).join("")||"<div class='card'>No registered users yet.</div>";
}

/* Add the new pages to the router and nav while preserving all existing pages. */
function proBuildNav(){
 buildNav();
 const nav=document.getElementById("nav");
 if(!nav)return;
 const add=(id,icon,label,adminOnly=false)=>{
   if(adminOnly&&!isAdmin())return;
   if([...nav.querySelectorAll("button")].some(b=>b.getAttribute("onclick")?.includes("'"+id+"'")))return;
   nav.insertAdjacentHTML("beforeend",`<button onclick="showPage('${id}',this)"><span class="nav-icon">${icon}</span><span>${label}</span></button>`);
 };
 add("social","🌐","Social Lead Center");
 if(isAdmin())add("masteradmin","👑","Master Admin");
}

pages.social=socialInboxPage;
pages.masteradmin=proAdminPage;

const _showPage=window.showPage;
window.showPage=function(page,button){
 if(page==="social" || page==="masteradmin"){
   if(page==="masteradmin"&&!isAdmin()){toast("Admin access required");return}
   currentPage=page;
   document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
   if(button)button.classList.add("active");
   else [...document.querySelectorAll(".nav button")].find(x=>x.getAttribute("onclick")?.includes("'"+page+"'"))?.classList.add("active");
   document.getElementById("content").innerHTML=pages[page]();
   if(page==="masteradmin")setTimeout(renderAdminUsers,50);
   window.scrollTo(0,0);return;
 }
 _showPage(page,button);
 setTimeout(proDashboardEnhance,0);
};

/* Ensure the enhanced nav is used after login/session restore. */
const _buildNav=window.buildNav;
window.buildNav=function(){_buildNav();proBuildNav();};

document.addEventListener("DOMContentLoaded",()=>{
 proEnsureArray();
 proSync();
 setTimeout(()=>{if(currentUser)proWelcome();},350);
});

</script>


<script id="estateai-premium-motion-js">
(function(){
 const apply=()=>{document.querySelectorAll('#content>.card,#content>.kpi,#content>.property,#content>.feature,#content>.grid2>.card,#content>.grid3>.card').forEach((el,i)=>{el.style.animationDelay=Math.min(i*55,420)+'ms'});};
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(b){b.style.transform='scale(.98)';setTimeout(()=>b.style.transform='',120)}});
 const obs=new MutationObserver(()=>requestAnimationFrame(apply));
 obs.observe(document.getElementById('content')||document.body,{childList:true,subtree:true});
 apply();
})();
</script>
